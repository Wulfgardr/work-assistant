[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "work-assistant"
version = "0.6.0"
description = "Gestione locale e indipendente dal provider per persone e agenti AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Work Assistant contributors" }]
keywords = ["email", "mcp", "agents", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["cryptography>=45,<51"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.26,<2"]
attachments = ["firecrawl-anydoc>=0.2,<1"]
dev = ["build>=1.2,<2", "pytest>=8,<9", "pyyaml>=6,<7"]

[project.scripts]
work-assistant = "work_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_assistant = ["templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
