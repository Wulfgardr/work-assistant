schema_version = 1
# Se omesso, Work Assistant usa la cartella dati dell'utente specifica del
# sistema operativo. Non collocare archivio e chiavi nel repository.
# data_dir = "/percorso/esterno/al/repository"

[privacy]
# off: nessuna trasformazione; all: protegge ogni mittente;
# selective: usa regole ordinate.
mode = "all"
default_action = "pseudonymize"
# Registro JSON facoltativo. Il valore predefinito è
# <data_dir>/privacy/entities.json e deve essere accessibile solo al proprietario.

# In modalità selective prevale la prima regola corrispondente.
#[[privacy.sender_rules]]
#pattern = "newsletter@example.test"
#action = "allow_raw"

[attachments]
# enabled = false disabilita l'estrazione del testo derivato dagli allegati.
# I byte originali restano dal provider: solo il testo derivato viene
# conservato in cache e, verso gli agenti, pseudonimizzato.
# enabled = true
# Testo massimo conservato e restituito per allegato, in caratteri.
# max_text_chars = 20000
# Limite locale dei byte letti per allegato.
# max_bytes = 33554432
# ocr_mode = "auto" usa il binario tesseract locale se presente; "off" lo disabilita.
# ocr_mode = "auto"
# ocr_languages = "auto" sceglie ita+eng quando disponibili, altrimenti eng.
# ocr_languages = "auto"
# Pagine massime rese dal renderer PDF locale prima dell'OCR.
# ocr_max_pages = 10

[accounts.personal]
provider = "demo"
source = "./examples/demo-mailbox.jsonl"
address = "alex@example.test"

[accounts.team]
provider = "demo"
source = "./examples/team-mailbox.jsonl"
address = "team@example.test"

# Esempio per l'onboarding Zimbra o Carbonio. Il repository pubblico prepara
# la sessione locale; serve comunque un adapter compatibile.
# [accounts.work]
# provider = "zimbra"
# host = "mail.example.test"
# address = "alex@example.test"

# Esempio per un account IMAP generico (solo TLS). La password per le app
# vive nel secret_file (prima riga, permessi 0600), mai nel TOML.
# [accounts.office]
# provider = "imap"
# host = "imap.example.test"
# address = "alex@example.test"
# secret_file = "/secure/path/office.imap.secret"

# Esempio per Exchange Online con l'adapter sperimentale work-assistant-graph.
# [accounts.m365]
# provider = "graph"
# address = "alex@example.test"
# client_id = "00000000-0000-0000-0000-000000000000"
# tenant = "common"
# token_file = "/secure/path/m365.graph.token.json"
