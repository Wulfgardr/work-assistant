schema_version = 1
# Se omesso, Work Assistant usa la cartella dati dell'utente specifica del
# sistema operativo. Non collocare archivio e chiavi nel repository.
# data_dir = "/percorso/esterno/al/repository"

[privacy]
# off: nessuna trasformazione; all: protegge ogni mittente;
# selective: usa regole ordinate.
mode = "all"
default_action = "pseudonymize"
# Registro JSON facoltativo. Il valore predefinito è
# <data_dir>/privacy/entities.json e deve essere accessibile solo al proprietario.

# In modalità selective prevale la prima regola corrispondente.
#[[privacy.sender_rules]]
#pattern = "newsletter@example.test"
#action = "allow_raw"

[accounts.personal]
provider = "demo"
source = "./examples/demo-mailbox.jsonl"
address = "alex@example.test"

[accounts.team]
provider = "demo"
source = "./examples/team-mailbox.jsonl"
address = "team@example.test"

# Esempio per l'onboarding Zimbra o Carbonio. Il repository pubblico prepara
# la sessione locale; serve comunque un adapter compatibile.
# [accounts.work]
# provider = "zimbra"
# host = "mail.example.test"
# address = "alex@example.test"
