name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,mcp]"
      - run: pytest
      - run: python scripts/privacy_check.py
      - run: work-assistant benchmark-privacy --iterations 20 --body-kib 4 --budget-ms 50
