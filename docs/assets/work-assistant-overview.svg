<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Come lavora Work Assistant</title>
  <desc id="desc">Le caselle di posta alimentano un archivio locale. Un broker applica le regole di riservatezza e offre strumenti controllati all'agente. La persona mantiene il controllo sulle azioni.</desc>
  <rect width="1200" height="520" fill="#f7f2e7"/>
  <path d="M0 394C190 340 331 457 520 404c188-53 325-18 680-93v209H0Z" fill="#dce8d8"/>
  <g font-family="Avenir Next, system-ui, sans-serif" fill="#172019">
    <text x="72" y="82" font-size="42" font-weight="700">Dalla posta a un lavoro controllato</text>
    <text x="72" y="120" font-size="20" fill="#3c493f">I dati restano locali. L’agente riceve solo ciò che la regola consente.</text>
  </g>
  <g stroke="#294b37" stroke-width="4" fill="none" stroke-linecap="round">
